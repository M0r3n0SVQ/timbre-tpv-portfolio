name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El CI solo lee el código: si un paso se viera comprometido, no podría
# escribir en el repositorio.
permissions:
  contents: read

# Un push nuevo a la misma rama/PR cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Bloqueante: una vulnerabilidad alta o crítica en lo que llega al
      # navegador o al servidor de producción para el pipeline.
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      # Informativa: las de desarrollo (lint, tests, build) no se despliegan.
      # Quedan a la vista en el log sin bloquear; Dependabot propone los
      # arreglos cuando existen.
      - name: Auditoría de dependencias de desarrollo (informativa)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build (incluye el chequeo de tipos de TypeScript)
        run: npm run build
