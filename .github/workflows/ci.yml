name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Solo bloquea por dependencias de producción
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Auditoría de dependencias de desarrollo (informativa)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build (incluye el chequeo de tipos de TypeScript)
        run: npm run build
